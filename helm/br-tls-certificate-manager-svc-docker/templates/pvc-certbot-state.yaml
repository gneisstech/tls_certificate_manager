{{- if .Values.certbot.pvc.create -}}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: 'br-az-files-certbot-state-{{ .Release.Namespace }}-pvc'
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: '10G'
  storageClassName: 'manual-certbot-state'
  volumeMode: 'Filesystem'
  volumeName: 'br-az-files-certbot-state-{{ .Release.Namespace }}-pv'
{{- end -}}
