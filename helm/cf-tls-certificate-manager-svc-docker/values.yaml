# Default values for cf-tls-certificate-manager-svc-docker.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: 'cfdevregistry.azurecr.io/cf-tls-certificate-manager-svc-docker'
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

config:
  # placeholder values should allow the service to install and minimally respond
  environment:
    TEST_HOST_URL: 'fixme-placeholder-cf-tls-certificate-manager-test-host-url'
    SERVICE_PRINCIPAL_CLIENT_ID: 'fixme-placeholder-cf-tls-certificate-manager-service-principal-client-id'
    SERVICE_PRINCIPAL_TENANT_ID: 'fixme-placeholder-cf-tls-certificate-manager-service-principal-tenant-id'
    SERVICE_PRINCIPAL_RESOURCE: 'fixme-placeholder-passage-application-id'
    APP_VERSION: '{{ .Chart.AppVersion }}'
  secrets:
    JWT_AUTH_TOKEN: 'fixme-placeholder-cf-tls-certificate-manager-jwt-auth-token'
    CF_DISTECH_LIGHTSMAP_API_KEY: 'fixme-placeholder-cf-tls-certificate-manager-distech-lightsmap-api-key'
    CF_SELF_HEALING_API_KEY: 'fixme-placeholder-cf-tls-certificate-manager-self-healing-api-key'
    SERVICE_PRINCIPAL_SECRET: 'fixme-placeholder-cf-tls-certificate-manager-service-principal-secret'

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths: []
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
